name: Build AnymeX (No Release)

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma-separated or 'all')"
        required: true
        default: "android,linux,ios"
        type: choice
        options:
          - all
          - android
          - linux
          - windows
          - macos
          - ios
          - android,linux,ios
          - android,ios
          - android,windows
          - android,linux
          - android,macos
          - linux,windows
          - linux,macos
          - windows,macos
          - ios,macos
      pr_numbers:
        description: "PR numbers to merge before building (comma-separated, e.g. 123,456,789). Leave empty to skip."
        required: false
        default: ""
      build_type:
        description: "Build type"
        required: true
        default: "alpha"
        type: choice
        options:
          - stable
          - alpha
      tag_override:
        description: "Version tag (e.g. v3.0.4-alpha or v3.0.4). Leave empty to auto-use latest release tag from this repo."
        required: false
        default: ""
      triggered_by:
        description: "Discord user ID of who triggered this build (set automatically by the Discord bot) OR GitHub username"
        required: false
        default: ""

env:
  FLUTTER_VERSION: "3.32.8"
  ZSIGN_VERSION: "0.7"

jobs:

  # ─────────────────────────────────────────────
  # Resolve version tag
  # ─────────────────────────────────────────────
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      effective_tag: ${{ steps.get-tag.outputs.effective_tag }}
    steps:
      - name: Resolve effective tag
        id: get-tag
        shell: bash
        run: |
          TAG_OVERRIDE="${{ github.event.inputs.tag_override }}"

          if [ -n "$TAG_OVERRIDE" ]; then
            echo "📌 Using provided tag: $TAG_OVERRIDE"
            RAW_TAG="$TAG_OVERRIDE"
          else
            echo "🔍 No tag provided — fetching latest release from ${{ github.repository }}..."
            RAW_TAG=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | jq -r '.tag_name')

            if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "null" ]; then
              echo "❌ Could not fetch latest release tag — please provide tag_override manually"
              exit 1
            fi

            echo "✅ Latest release tag: $RAW_TAG"
          fi

          # Replace -beta suffix with -alpha (e.g. v3.0.7+5-beta → v3.0.7+5-alpha)
          EFFECTIVE_TAG="${RAW_TAG/-beta/-alpha}"
          if [ "$EFFECTIVE_TAG" != "$RAW_TAG" ]; then
            echo "🔄 Replaced -beta with -alpha: $RAW_TAG → $EFFECTIVE_TAG"
          fi

          echo "effective_tag=$EFFECTIVE_TAG" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────
  # Resolve which platforms to actually build
  # ─────────────────────────────────────────────
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Resolve platform matrix
        id: set-matrix
        shell: bash
        run: |
          INPUT="${{ github.event.inputs.platforms }}"
          ALL='["android","linux","windows","macos","ios"]'

          if [ "$INPUT" = "all" ]; then
            PLATFORMS="$ALL"
          else
            IFS=',' read -ra PARTS <<< "$INPUT"
            JSON="["
            for i in "${!PARTS[@]}"; do
              PART=$(echo "${PARTS[$i]}" | xargs)   # trim whitespace
              if [ $i -gt 0 ]; then JSON+=","; fi
              JSON+="\"$PART\""
            done
            JSON+="]"
            PLATFORMS="$JSON"
          fi

          # Map platform → runner OS
          MATRIX_INCLUDES=""
          FIRST=true
          for PLATFORM in $(echo "$PLATFORMS" | jq -r '.[]'); do
            case "$PLATFORM" in
              android) OS="ubuntu-latest" ;;
              linux)   OS="ubuntu-latest" ;;
              windows) OS="windows-latest" ;;
              macos)   OS="macos-latest" ;;
              ios)     OS="macos-latest" ;;
              *)       echo "Unknown platform: $PLATFORM"; continue ;;
            esac
            if [ "$FIRST" = true ]; then FIRST=false; else MATRIX_INCLUDES+=","; fi
            MATRIX_INCLUDES+="{\"platform\":\"$PLATFORM\",\"os\":\"$OS\"}"
          done

          MATRIX="{\"include\":[$MATRIX_INCLUDES]}"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Resolved matrix: $MATRIX"

  # ─────────────────────────────────────────────
  # Main build job
  # ─────────────────────────────────────────────
  build:
    needs: [resolve-matrix, resolve-tag]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3
        with:
          path: alpha-repo

      # ── Clone main repo ──────────────────────
      - name: Clone Main Repository
        shell: bash
        run: |
          echo "════════════════════════════════════════════"
          echo "  Cloning Main Repository"
          echo "════════════════════════════════════════════"
          git clone https://github.com/RyanYuuki/AnymeX.git main-repo
          echo "✅ Cloned RyanYuuki/AnymeX to main-repo/"

      # ── Merge PRs ────────────────────────────
      - name: Merge Pull Requests
        shell: bash
        run: |
          PR_INPUT="${{ github.event.inputs.pr_numbers }}"

          if [ -z "$PR_INPUT" ]; then
            echo "ℹ️  No PR numbers provided — skipping merge step."
            exit 0
          fi

          echo "════════════════════════════════════════════"
          echo "  Merging Pull Requests: $PR_INPUT"
          echo "════════════════════════════════════════════"

          cd main-repo
          git config user.email "ci-bot@github.com"
          git config user.name "CI Bot"

          IFS=',' read -ra PRS <<< "$PR_INPUT"
          ERRORS=0

          for PR in "${PRS[@]}"; do
            PR=$(echo "$PR" | xargs)  # trim whitespace
            echo ""
            echo "────────────────────────────────────────────"
            echo "  Processing PR #$PR"
            echo "────────────────────────────────────────────"

            # Fetch the PR head ref into a local temp branch
            FETCH_RESULT=$(git fetch origin "refs/pull/$PR/head:pr/$PR" 2>&1)
            if [ $? -ne 0 ]; then
              echo "❌ Failed to fetch PR #$PR"
              echo "   $FETCH_RESULT"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            echo "✅ Fetched PR #$PR"

            # Attempt merge
            MERGE_RESULT=$(git merge "pr/$PR" --no-ff -m "ci: merge PR #$PR for build" 2>&1)
            if [ $? -ne 0 ]; then
              echo "❌ Failed to merge PR #$PR (merge conflict?)"
              echo "   $MERGE_RESULT"
              ERRORS=$((ERRORS + 1))
              git merge --abort 2>/dev/null || true
              continue
            fi

            echo "✅ Merged PR #$PR"
          done

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "❌ $ERRORS PR(s) failed to merge. Aborting build."
            exit 1
          fi

          echo ""
          echo "✅ All PRs merged successfully"

      # ── Checkout Flutter version ──────────────
      - name: Checkout Flutter Version
        shell: bash
        run: |
          echo "════════════════════════════════════════════"
          echo "  Flutter Setup"
          echo "════════════════════════════════════════════"
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          fi
          # Download Flutter with specific version
          cd ${{ runner.temp }}
          rm -rf flutter-temp
          mkdir flutter-temp
          cd flutter-temp
          git clone https://github.com/flutter/flutter.git
          cd flutter
          git checkout $FLUTTER_VERSION
          echo "FLUTTER_HOME=${{ runner.temp }}/flutter-temp/flutter" >> $GITHUB_ENV
          echo "${{ runner.temp }}/flutter-temp/flutter/bin" >> $GITHUB_PATH

      - name: Flutter version
        run: flutter --version

      # ── Android Setup ─────────────────────────
      - name: Setup Android Build Environment
        if: matrix.platform == 'android'
        shell: bash
        run: |
          echo "════════════════════════════════════════════"
          echo "  Android Setup"
          echo "════════════════════════════════════════════"
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          sdkmanager "build-tools;34.0.0"
          echo "✅ Android build tools installed"

      # ── iOS Setup ──────────────────────────────
      - name: Setup iOS Build Environment
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          echo "════════════════════════════════════════════"
          echo "  iOS Setup"
          echo "════════════════════════════════════════════"
          flutter config --enable-ios
          cd main-repo
          flutter pub get
          cd ios
          pod install
          echo "✅ iOS build environment ready"

      # ── Get dependencies ───────────────────────
      - name: Get Flutter Dependencies
        shell: bash
        run: |
          echo "════════════════════════════════════════════"
          echo "  Getting Dependencies"
          echo "════════════════════════════════════════════"
          cd main-repo
          flutter pub get
          echo "✅ Dependencies obtained"

      # ── Generate build files ───────────────────
      - name: Generate Build Files
        shell: bash
        run: |
          echo "════════════════════════════════════════════"
          echo "  Generating Build Files"
          echo "════════════════════════════════════════════"
          cd main-repo
          flutter pub run build_runner build --release
          echo "✅ Build files generated"

      # ── Build Android ──────────────────────────
      - name: Build Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          echo "════════════════════════════════════════════"
          echo "  Building Android"
          echo "════════════════════════════════════════════"
          cd main-repo
          EFFECTIVE_TAG="${{ needs.resolve-tag.outputs.effective_tag }}"
          flutter build apk --release --build-number=${EFFECTIVE_TAG#v} --target-platform=android-arm64
          flutter build apk --release --build-number=${EFFECTIVE_TAG#v} --target-platform=android-arm
          flutter build apk --release --build-number=${EFFECTIVE_TAG#v} --target-platform=android-x86_64
          flutter build apk --release --build-number=${EFFECTIVE_TAG#v}
          echo "✅ Android build complete"

      # ── Build Linux ────────────────────────────
      - name: Build Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          echo "════════════════════════════════════════════"
          echo "  Building Linux"
          echo "════════════════════════════════════════════"
          cd main-repo
          flutter build linux --release
          echo "✅ Linux build complete"

      # ── Build Windows ──────────────────────────
      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          echo "════════════════════════════════════════════"
          echo "  Building Windows"
          echo "════════════════════════════════════════════"
          cd main-repo
          flutter build windows --release
          echo "✅ Windows build complete"

      # ── Build macOS ────────────────────────────
      - name: Build macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          echo "════════════════════════════════════════════"
          echo "  Building macOS"
          echo "════════════════════════════════════════════"
          cd main-repo
          flutter build macos --release
          echo "✅ macOS build complete"

      # ── Build iOS ──────────────────────────────
      - name: Build iOS
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          echo "════════════════════════════════════════════"
          echo "  Building iOS"
          echo "════════════════════════════════════════════"
          cd main-repo
          flutter build ios --release --no-codesign
          echo "✅ iOS build complete"

      # ── Package artifacts ──────────────────────
      - name: Package Artifacts
        if: always()
        shell: bash
        run: |
          echo "════════════════════════════════════════════"
          echo "  Packaging Artifacts"
          echo "════════════════════════════════════════════"
          mkdir -p artifacts
          cd main-repo

          # Android
          if [ -d "build/app/outputs/flutter-apk" ]; then
            for apk in build/app/outputs/flutter-apk/*.apk; do
              [ -f "$apk" ] && cp "$apk" ../artifacts/
            done
          fi

          # Linux
          if [ -d "build/linux/x64/release/bundle" ]; then
            cd build/linux/x64/release
            zip -r ../../../../artifacts/AnymeX-Linux.zip bundle
            cd ../../../../
          fi

          # Windows
          if [ -d "build/windows/runner/Release" ]; then
            cd build/windows/runner/Release
            zip -r ../../../../artifacts/AnymeX-Windows-zip.zip . -x ".git*"
            cd ../../../../
          fi

          # macOS
          if [ -d "build/macos/Build/Products/Release" ]; then
            cd build/macos/Build/Products/Release
            zip -r ../../../../artifacts/AnymeX-macOS.zip AnymeX.app
            cd ../../../../
          fi

          # iOS
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cd build/ios/iphoneos
            zip -r ../../../artifacts/AnymeX-iOS.ipa Runner.app
            cd ../../../
          fi

          cd ../artifacts
          ls -lah
          echo "✅ Artifacts packaged"

      # ── Upload artifacts ───────────────────────
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: AnymeX-${{ matrix.platform }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 90

      # ── Report build status ────────────────────
      - name: Report Build Status
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Build succeeded for ${{ matrix.platform }}"
          else
            echo "❌ Build failed for ${{ matrix.platform }}"
          fi

  # ─────────────────────────────────────────────
  # Collect results from all platforms
  # ─────────────────────────────────────────────
  collect-results:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    outputs:
      results_json: ${{ steps.collect.outputs.results_json }}
    steps:
      - name: Collect Build Results
        id: collect
        shell: bash
        run: |
          RESULTS='{"android":"skipped","linux":"skipped","windows":"skipped","macos":"skipped","ios":"skipped"}'

          # Check GitHub API for job statuses
          JOBS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100")

          update_status() {
            local PLATFORM="$1"
            local STATUS="$2"
            RESULTS=$(echo "$RESULTS" | jq --arg p "$PLATFORM" --arg s "$STATUS" '.[$p] = $s')
          }

          # Parse job names and conclusions
          echo "$JOBS" | jq -r '.jobs[] | select(.name | test("Build (Android|Linux|Windows|macOS|iOS)")) | "\(.name | sub("Build "; "") | ascii_downcase) \(.conclusion)"' | while read PLATFORM CONCLUSION; do
            if [ "$CONCLUSION" = "success" ]; then
              update_status "$PLATFORM" "success"
            elif [ "$CONCLUSION" = "failure" ]; then
              update_status "$PLATFORM" "failed"
            elif [ "$CONCLUSION" = "skipped" ]; then
              update_status "$PLATFORM" "skipped"
            fi
          done

          echo "results_json=$RESULTS" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────
  # Send Discord notification with artifacts
  # ─────────────────────────────────────────────
  notify:
    if: always()
    needs: [resolve-tag, collect-results]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v3
        with:
          path: all_artifacts

      - name: Generate Artifact Links and Sizes
        id: artifacts-info
        shell: bash
        run: |
          # Collect artifact info
          mkdir -p artifact_details
          cd all_artifacts

          get_artifact() {
            local SEARCH_NAME="$1"
            local LABEL="$2"
            ls -R . | grep -i "$SEARCH_NAME" | head -1 | while read FILE; do
              if [ -f "$FILE" ]; then
                SIZE=$(du -sh "$FILE" | cut -f1)
                echo "$FILE|$SIZE"
              fi
            done
          }

          # Output for later use
          echo "APK_ARM64=$(get_artifact "arm64" "arm64-v8a")"                   >> $GITHUB_ENV
          echo "APK_ARMEABI=$(get_artifact "armeabi" "armeabi-v7a")"             >> $GITHUB_ENV
          echo "APK_UNIVERSAL=$(get_artifact "release.apk" "universal")"         >> $GITHUB_ENV
          echo "APK_X86=$(get_artifact "x86" "x86_64")"                          >> $GITHUB_ENV
          echo "LINUX_APPIMAGE=$(get_artifact "appimage" "AppImage")"            >> $GITHUB_ENV
          echo "LINUX_RPM=$(get_artifact "rpm" "RPM")"                           >> $GITHUB_ENV
          echo "LINUX_ZIP=$(get_artifact "linux" "Zip")"                         >> $GITHUB_ENV
          echo "WIN_ZIP=$(get_artifact "windows" "Portable")"                    >> $GITHUB_ENV
          echo "WIN_INSTALLER=$(get_artifact "installer" "Installer")"           >> $GITHUB_ENV
          echo "MACOS=$(get_artifact "macos" "DMG")"                             >> $GITHUB_ENV
          echo "IOS=$(get_artifact "ipa" "IPA")"                                 >> $GITHUB_ENV

      - name: Send Discord Notification
        run: |
          TAG="${{ needs.resolve-tag.outputs.effective_tag }}"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          PLATFORMS="${{ github.event.inputs.platforms }}"
          PR_NUMBERS="${{ github.event.inputs.pr_numbers }}"
          RUN_NUMBER="${{ github.run_number }}"
          RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          ACTION_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          # ─────────────────────────────────────────────
          # DISCORD ID RESOLUTION (Multiple methods)
          # ─────────────────────────────────────────────
          
          # Method 1: Discord bot passes Discord ID directly
          DISCORD_ID="${{ github.event.inputs.triggered_by }}"
          
          # Method 2: If triggered_by is empty OR looks like GitHub username (not a number)
          # Fall back to github.actor username mapping
          if [ -z "$DISCORD_ID" ] || ! [[ "$DISCORD_ID" =~ ^[0-9]+$ ]]; then
            ACTOR="${{ github.actor }}"
            case "$ACTOR" in
              Rieversed)       DISCORD_ID="617537674084876318" ;;
              NITHINSPACETIME) DISCORD_ID="1474618752912851064" ;;
              Neoniq)          DISCORD_ID="150865547922243584" ;;
              itsmechinmoy)    DISCORD_ID="523539866311720963" ;;
              Shebyyy)         DISCORD_ID="612532963938271232" ;;
              *)               DISCORD_ID="" ;;
            esac
          fi
          
          MENTION=$([ -n "$DISCORD_ID" ] && echo "<@${DISCORD_ID}>" || echo "")

          # Load per-platform results from collect-results job
          RESULTS='${{ needs.collect-results.outputs.results_json }}'

          get_status() {
            echo "$RESULTS" | jq -r --arg p "$1" '.[$p] // "skipped"'
          }

          # Determine overall status emoji + color
          ALL_SUCCESS=true
          ANY_FAILED=false
          PLATFORMS_INPUT="${{ github.event.inputs.platforms }}"
          if [ "$PLATFORMS_INPUT" = "all" ]; then
            CHECK_PLATFORMS="android linux windows macos ios"
          else
            CHECK_PLATFORMS=$(echo "$PLATFORMS_INPUT" | tr ',' ' ')
          fi

          for P in $CHECK_PLATFORMS; do
            S=$(get_status "$P")
            [ "$S" != "success" ] && ALL_SUCCESS=false
            [ "$S" = "failed"  ] && ANY_FAILED=true
          done

          if [ "$ALL_SUCCESS" = true ]; then
            OVERALL_EMOJI="✅"
            OVERALL_LABEL="All builds passed"
            COLOR=3066993   # green
          elif [ "$ANY_FAILED" = true ] && [ "$ALL_SUCCESS" = false ]; then
            # Check if some passed
            SOME_PASSED=false
            for P in $CHECK_PLATFORMS; do
              [ "$(get_status "$P")" = "success" ] && SOME_PASSED=true
            done
            if [ "$SOME_PASSED" = true ]; then
              OVERALL_EMOJI="⚠️"
              OVERALL_LABEL="Some builds failed"
              COLOR=16776960  # yellow
            else
              OVERALL_EMOJI="❌"
              OVERALL_LABEL="All builds failed"
              COLOR=15158332  # red
            fi
          else
            OVERALL_EMOJI="❌"
            OVERALL_LABEL="Build failed"
            COLOR=15158332
          fi

          # Build status summary line per platform
          STATUS_LINES=""
          platform_status_line() {
            local PLATFORM="$1"
            local EMOJI_ICON="$2"
            local S=$(get_status "$PLATFORM")
            case "$S" in
              success) STATUS_LINES+="${EMOJI_ICON} **$(echo "$PLATFORM" | tr '[:lower:]' '[:upper:]')** ✅\n" ;;
              failed)  STATUS_LINES+="${EMOJI_ICON} **$(echo "$PLATFORM" | tr '[:lower:]' '[:upper:]')** ❌ Failed\n" ;;
              *)       ;; # skipped / not requested — don't show
            esac
          }

          for P in $CHECK_PLATFORMS; do
            case "$P" in
              android) platform_status_line android "📱" ;;
              ios)     platform_status_line ios     "🍎" ;;
              linux)   platform_status_line linux   "🐧" ;;
              windows) platform_status_line windows "🪟" ;;
              macos)   platform_status_line macos   "🖥️" ;;
            esac
          done

          # Fetch PR titles from GitHub API
          if [ -z "$PR_NUMBERS" ]; then
            PR_DISPLAY="None"
          else
            PR_DISPLAY=""
            IFS=',' read -ra PRS <<< "$PR_NUMBERS"
            for PR in "${PRS[@]}"; do
              PR=$(echo "$PR" | xargs)
              PR_DATA=$(curl -s \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/RyanYuuki/AnymeX/pulls/$PR")
              PR_TITLE=$(echo "$PR_DATA" | jq -r '.title // "Unknown"')
              PR_DISPLAY+=$'\n'"• #${PR} - ${PR_TITLE}"
            done
          fi

          # Helper: "URL|SIZE" → markdown line
          make_line() {
            local LABEL="$1"
            local VALUE="$2"
            if [ -n "$VALUE" ]; then
              local URL=$(echo "$VALUE" | cut -d'|' -f1)
              local SIZE=$(echo "$VALUE" | cut -d'|' -f2)
              echo "**${LABEL}** | [Download](${URL}) | ${SIZE}"
            fi
          }

          # Build per-platform artifact field content
          ANDROID_FIELD=""
          [ -n "$APK_ARM64" ]     && ANDROID_FIELD+="$(make_line "arm64-v8a"   "$APK_ARM64")\n"
          [ -n "$APK_ARMEABI" ]   && ANDROID_FIELD+="$(make_line "armeabi-v7a" "$APK_ARMEABI")\n"
          [ -n "$APK_UNIVERSAL" ] && ANDROID_FIELD+="$(make_line "universal"   "$APK_UNIVERSAL")\n"
          [ -n "$APK_X86" ]       && ANDROID_FIELD+="$(make_line "x86_64"      "$APK_X86")\n"

          WINDOWS_FIELD=""
          [ -n "$WIN_INSTALLER" ] && WINDOWS_FIELD+="$(make_line "Installer .exe" "$WIN_INSTALLER")\n"
          [ -n "$WIN_ZIP" ]       && WINDOWS_FIELD+="$(make_line "Portable .zip"  "$WIN_ZIP")\n"

          LINUX_FIELD=""
          [ -n "$LINUX_APPIMAGE" ] && LINUX_FIELD+="$(make_line "AppImage" "$LINUX_APPIMAGE")\n"
          [ -n "$LINUX_RPM" ]      && LINUX_FIELD+="$(make_line "RPM"      "$LINUX_RPM")\n"
          [ -n "$LINUX_ZIP" ]      && LINUX_FIELD+="$(make_line "Zip"      "$LINUX_ZIP")\n"

          IOS_FIELD=""
          [ -n "$IOS" ]   && IOS_FIELD+="$(make_line "IPA" "$IOS")\n"

          MACOS_FIELD=""
          [ -n "$MACOS" ] && MACOS_FIELD+="$(make_line "DMG" "$MACOS")\n"

          # Build fields array
          FIELDS="[]"
          add_field() {
            local NAME="$1"
            local VALUE="$(echo -e "$2" | sed '/^$/d')"
            if [ -n "$VALUE" ]; then
              FIELDS=$(echo "$FIELDS" | jq \
                --arg name "$NAME" \
                --arg value "$VALUE" \
                '. + [{"name": $name, "value": $value, "inline": false}]')
            fi
          }

          [ -n "$ANDROID_FIELD" ] && add_field "📱 Android" "$ANDROID_FIELD"
          [ -n "$WINDOWS_FIELD" ] && add_field "🪟 Windows" "$WINDOWS_FIELD"
          [ -n "$LINUX_FIELD" ]   && add_field "🐧 Linux"   "$LINUX_FIELD"
          [ -n "$IOS_FIELD" ]     && add_field "🍎 iOS"     "$IOS_FIELD"
          [ -n "$MACOS_FIELD" ]   && add_field "🖥️ macOS"  "$MACOS_FIELD"

          # Add build status summary field (always shown, even on full failure)
          STATUS_VALUE="$(echo -e "$STATUS_LINES" | sed '/^$/d')"
          if [ -n "$STATUS_VALUE" ]; then
            FIELDS=$(echo "$FIELDS" | jq \
              --arg value "$STATUS_VALUE" \
              '. + [{"name": "🏗️ Build Status", "value": $value, "inline": false}]')
          fi

          # Build description
          DESCRIPTION=$(printf '%s %s\n\n⚙️ Build #%s | %s\n🔀 Merged PRs:%s\n🖥️ Platforms: %s\n\n[🔗 View Run](%s)' \
            "$OVERALL_EMOJI" "$OVERALL_LABEL" \
            "$RUN_NUMBER" "$BUILD_TYPE" \
            "$PR_DISPLAY" "$PLATFORMS" \
            "$ACTION_URL")

          PAYLOAD=$(printf '%s' "$FIELDS" | jq \
            --arg tag "$TAG" \
            --rawfile description <(printf '%s' "$DESCRIPTION") \
            --argjson color "$COLOR" \
            --arg footer "Artifacts expire in 90 days • $ACTION_URL" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            '{
              "embeds": [{
                "title": ("🔨 Test Build: " + $tag),
                "description": $description,
                "color": $color,
                "fields": .,
                "footer": { "text": $footer },
                "timestamp": $timestamp
              }]
            }')

          echo "Sending Discord notification..."
          # Inject mention into content field if Discord ID is provided
          if [ -n "$MENTION" ]; then
            PAYLOAD=$(echo "$PAYLOAD" | jq --arg mention "$MENTION" '. + {"content": $mention}')
          fi
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_BUILDS }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          echo "✅ Discord notification sent"
