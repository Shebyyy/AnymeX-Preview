name: Test App Announcement Broadcast

on:
  workflow_dispatch:

jobs:
  test_broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Latest Tag
        id: fetch_tags
        run: |
          LATEST_TAG=""

          # Try releases/latest first (fastest and uses authentication)
          LATEST_TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name // empty')

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            # Fallback to tags API with authentication
            curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/tags" -o tags.json

            if jq -e 'if type=="array" then true else false end' tags.json > /dev/null 2>&1; then
              LATEST_TAG=$(jq -r '.[0].name // empty' tags.json)
            fi
          fi

          echo "Determined LATEST_TAG: $LATEST_TAG"
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Could not find latest tag. Using v3.1.8-beta as fallback."
            LATEST_TAG="v3.1.8-beta"
          fi
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

      - name: Get Latest Release Notes
        id: get_release_notes
        run: |
          RELEASE_DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ env.LATEST_TAG }}")

          RELEASE_NOTES=$(echo "$RELEASE_DATA" | jq -r '.body // empty')
          if [ -z "$RELEASE_NOTES" ] || [ "$RELEASE_NOTES" = "null" ]; then
            RELEASE_NOTES="AnymeX update ${{ env.LATEST_TAG }} is now live!"
          fi
          echo "Release Notes:"
          echo "$RELEASE_NOTES"
          echo "$RELEASE_NOTES" > release_notes.txt

      - name: Format Release Notes
        id: format_notes
        run: |
          sed 's/||//g' release_notes.txt > clean_release_notes.txt
          echo "" > formatted_notes.txt

          extract_section() {
            local title="$1"
            local emoji="$2"

            local start=$(grep -n "^### $emoji $title" clean_release_notes.txt | cut -d: -f1)
            if [ -z "$start" ]; then return; fi

            local next=$(tail -n +$((start + 1)) clean_release_notes.txt | grep -n '^### ' | head -n1 | cut -d: -f1)
            if [ -z "$next" ]; then
              content=$(tail -n +$((start + 1)) clean_release_notes.txt | grep '^-' | head -n 5)
            else
              end=$((start + next - 1))
              content=$(sed -n "$((start + 1)),$((end - 1))p" clean_release_notes.txt | grep '^-' | head -n 5)
            fi

            if [ -n "$content" ]; then
              echo "### $emoji $title" >> formatted_notes.txt
              echo "$content" >> formatted_notes.txt
              echo "" >> formatted_notes.txt
            fi
          }

          extract_section "Features" "🌟"
          extract_section "Bug Fixes & Improvements" "🔧"
          extract_section "Refactors" "🔧"
          extract_section "Style Changes" "🎨"
          extract_section "Performance Improvements" "🚀"
          extract_section "Chores & Documentation" "🧹"

          echo "Preview of formatted notes:"
          cat formatted_notes.txt

      - name: Broadcast announcement to AnymeX App
        env:
          ANNOUNCEMENT_API_URL: ${{ secrets.ANNOUNCEMENT_API_URL || 'http://anymex.duckdns.org:8000/functions/v1/announcements' }}
          ANNOUNCEMENT_API_KEY: ${{ secrets.ANNOUNCEMENT_API_KEY }}
        run: |
          if [ -z "$ANNOUNCEMENT_API_KEY" ]; then
            echo "ANNOUNCEMENT_API_KEY secret is not configured in repository secrets."
            exit 1
          fi

          TAG="${{ env.LATEST_TAG }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"

          if [[ "$TAG" == *"alpha"* ]]; then
            CATEGORY="update"
            TITLE="AnymeX Alpha ${TAG} Released"
            SHORT_DESC="AnymeX Alpha ${TAG} is now available! Check out what's new."
          elif [[ "$TAG" == *"beta"* ]]; then
            CATEGORY="update"
            TITLE="AnymeX Beta ${TAG} Released"
            SHORT_DESC="AnymeX Beta ${TAG} is now available! Check out what's new."
          else
            CATEGORY="update"
            TITLE="AnymeX ${TAG} Released"
            SHORT_DESC="AnymeX ${TAG} is now live! Check out what's new and update now."
          fi

          if [ -s formatted_notes.txt ]; then
            BODY=$(cat formatted_notes.txt)
          elif [ -s clean_release_notes.txt ]; then
            BODY=$(cat clean_release_notes.txt)
          else
            BODY="A new update **${TAG}** has been released!"
          fi

          FULL_CONTENT="${BODY}"$'\n\n'"[View Full GitHub Release](${RELEASE_URL})"

          PAYLOAD=$(jq -nc \
            --arg app_id "anymex" \
            --arg title "$TITLE" \
            --arg short_desc "$SHORT_DESC" \
            --arg content "$FULL_CONTENT" \
            --arg category "$CATEGORY" \
            --arg announcement_key "$ANNOUNCEMENT_API_KEY" \
            '{
              "app_id": $app_id,
              "title": $title,
              "short_description": $short_desc,
              "full_content": $content,
              "category": $category,
              "pinned": true,
              "priority": 1,
              "publish": true,
              "announcement_key": $announcement_key
            }')

          echo "Broadcasting announcement to AnymeX app ($TITLE)..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -H "x-announcement-key: $ANNOUNCEMENT_API_KEY" \
            -X POST \
            -d "$PAYLOAD" \
            "$ANNOUNCEMENT_API_URL")

          echo "Response HTTP status: $HTTP_STATUS"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Successfully broadcasted announcement to AnymeX app!"
          else
            echo "Failed to broadcast announcement (HTTP $HTTP_STATUS)."
            exit 1
          fi
